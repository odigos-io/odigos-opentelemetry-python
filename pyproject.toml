[build-system]
requires = ["setuptools>=75.3.4", "wheel>=0.45.0"]
build-backend = "setuptools.build_meta"

[project]
name = "odigos-opentelemetry-python"
version = "1.0.90"
description = "Odigos Initializer for Python OpenTelemetry Components"
requires-python = ">=3.9"
authors = [
    { name = "odigos-io", email = "support@odigos.io" },
]
dependencies = [
    "uuid7 == 0.1.0",
    "urllib3 >= 2.6.3",  # security floor: urllib3 redirect/retry CVEs fixed in 2.5.0
    "zipp == 3.20.2",
    "idna == 3.15",
    "asgiref == 3.8.1",
    "certifi == 2025.1.31",
    "charset-normalizer == 3.4.1",
    "googleapis-common-protos == 1.66.0",
    "packaging == 24.2",
    "protobuf == 5.29.6",
    "importlib-metadata == 6.0",
    "wrapt == 1.17.3",
    "typing-extensions == 4.14.0",
    "opentelemetry-exporter-otlp-proto-http == 1.41.1",
    "opentelemetry-instrumentation == 0.62b1",
    "opentelemetry-instrumentation-aio-pika == 0.62b1",
    "opentelemetry-instrumentation-aiohttp-client == 0.62b1",
    "odigos-opentelemetry-instrumentation-aiohttp-server == 0.62b1",
    "opentelemetry-instrumentation-aiopg == 0.62b1",
    "opentelemetry-instrumentation-asgi == 0.62b1",
    "opentelemetry-instrumentation-asyncio == 0.62b1",
    "opentelemetry-instrumentation-asyncpg == 0.62b1",
    "opentelemetry-instrumentation-boto3sqs == 0.62b1",
    "opentelemetry-instrumentation-botocore == 0.62b1",
    "opentelemetry-instrumentation-cassandra == 0.62b1",
    "opentelemetry-instrumentation-celery == 0.62b1",
    "opentelemetry-instrumentation-click == 0.62b1",
    "odigos-opentelemetry-instrumentation-confluent-kafka == 0.62b1",
    "opentelemetry-instrumentation-dbapi == 0.62b1",
    "opentelemetry-instrumentation-django == 0.62b1",
    "odigos-opentelemetry-instrumentation-elasticsearch == 0.62b1",
    "opentelemetry-instrumentation-falcon == 0.62b1",
    "opentelemetry-instrumentation-fastapi == 0.62b1",
    "opentelemetry-instrumentation-flask == 0.62b1",
    "opentelemetry-instrumentation-grpc == 0.62b1",
    "opentelemetry-instrumentation-httpx == 0.62b1",
    "opentelemetry-instrumentation-jinja2 == 0.62b1",
    "opentelemetry-instrumentation-kafka-python == 0.62b1",
    "opentelemetry-instrumentation-logging == 0.62b1",
    "opentelemetry-instrumentation-mysql == 0.62b1",
    "opentelemetry-instrumentation-mysqlclient == 0.62b1",
    "opentelemetry-instrumentation-pika == 0.62b1",
    "opentelemetry-instrumentation-psycopg == 0.62b1",
    "opentelemetry-instrumentation-psycopg2 == 0.62b1",
    "opentelemetry-instrumentation-pymemcache == 0.62b1",
    "opentelemetry-instrumentation-pymongo == 0.62b1",
    "opentelemetry-instrumentation-pymssql == 0.62b1",
    "opentelemetry-instrumentation-pymysql == 0.62b1",
    "opentelemetry-instrumentation-pyramid == 0.62b1",
    "opentelemetry-instrumentation-redis == 0.62b1",
    "opentelemetry-instrumentation-remoulade == 0.62b1",
    "opentelemetry-instrumentation-requests == 0.62b1",
    "odigos-opentelemetry-instrumentation-sqlalchemy == 0.62b1",
    "opentelemetry-instrumentation-sqlite3 == 0.62b1",
    "opentelemetry-instrumentation-starlette == 0.62b1",
    "opentelemetry-instrumentation-tornado == 0.62b1",
    "opentelemetry-instrumentation-tortoiseorm == 0.62b1",
    "opentelemetry-instrumentation-threading == 0.62b1",
    "opentelemetry-instrumentation-urllib == 0.62b1",
    "opentelemetry-instrumentation-urllib3 == 0.62b1",
    "opentelemetry-instrumentation-wsgi == 0.62b1",

    # genai
    "opentelemetry-instrumentation-anthropic == 0.50.1",
    "opentelemetry-instrumentation-google-genai == 0.6b0",
    "opentelemetry-instrumentation-langchain == 0.50.1",
    "opentelemetry-instrumentation-openai-agents-v2 == 0.1.0",
    "odigos-opentelemetry-instrumentation-openai-v2 == 2.3b0",
    "opentelemetry-instrumentation-vertexai == 2.1b0",
    "opentelemetry-instrumentation-weaviate == 0.50.1",
]

[project.optional-dependencies]
test = [
    "pytest >= 8.0",
    "pyyaml >= 6.0",
]

[dependency-groups]
dev = [
    "ruff >= 0.15.12",
    "ty >= 0.0.33",
    "pre-commit >= 3.5.0",
]

[project.entry-points.opentelemetry_post_instrument]
odigos_post = "initializer.post_instrument:run_post_hook"

[project.entry-points.opentelemetry_distro]
odigos = "initializer.distro.distro:OdigosDistro"

[tool.uv]
# Security floors for transitive dependencies (they only apply when the package is pulled in).
# requires-python is >=3.9, so fixes that need 3.10 are applied per marker: the shipped image
# runs Python 3.11 and gets the fix, 3.9 keeps the newest release that still supports it.
constraint-dependencies = [
    "urllib3 >= 2.8.0; python_full_version >= '3.10'",   # GHSA-8988-9cw3-xx77, GHSA-vxq7-64xx-v4gw (2.6.3 is the last 3.9 release)
    "anyio >= 4.14.2; python_full_version >= '3.10'",    # GHSA-82r6-8w77-94w6, GHSA-3w57-8xmc-8v26
    "aiohttp >= 3.14.3; python_full_version >= '3.10'",  # GHSA-cq5v-8q36-5273
    "aiohttp >= 3.13.5; python_full_version < '3.10'",
    "filelock >= 3.20.3; python_full_version >= '3.10'", # GHSA-qmgc-5h2g-mvrw, GHSA-w853-jp5j-5j7f
    "virtualenv >= 21.7.13",                              # GHSA-p58f-9548-mpm2, GHSA-94p9-xgh2-xp45, GHSA-x78j-v8h9-3j2q
    "pygments >= 2.20.0",                                 # GHSA-5239-wwwm-4pmq
    "requests >= 2.33.0; python_full_version >= '3.10'",  # GHSA-gc5v-m9x4-r6x2
    "multidict >= 6.9.1; python_full_version >= '3.10'",  # GHSA-54p9-h82j-f925
    "pytest >= 9.0.3; python_full_version >= '3.10'",     # GHSA-6w46-j5rx-g56g
]

[tool.uv.sources]
odigos-opentelemetry-instrumentation-aiohttp-server = { workspace = true }
odigos-opentelemetry-instrumentation-elasticsearch = { workspace = true }
odigos-opentelemetry-instrumentation-confluent-kafka = { workspace = true }
odigos-opentelemetry-instrumentation-openai-v2 = { workspace = true }
odigos-opentelemetry-instrumentation-sqlalchemy = { workspace = true }

[tool.uv.workspace]
members = [
    "agent",
    "instrumentations/*",
]
exclude = [
    "tests/integration/configurator",
]

[tool.setuptools.packages.find]
include = [
    "initializer",
    "initializer.*",
    "opamp",
    "opamp.*",
    "opentelemetry",
    "opentelemetry.*",
]

[tool.ruff]
line-length = 150
target-version = "py39"
extend-exclude = [
    ".venv",
    "dist",
    "build",
    "*.egg-info",
    "tests/integration/configurator",
    "instrumentations/",
    "*_pb2.py",
]

[tool.ruff.lint]
# Default rule set: pycodestyle errors (E) + pyflakes (F).
select = ["E", "F"]

[tool.ruff.lint.per-file-ignores]
"initializer/components.py" = ["E402"]

[tool.ruff.format]
quote-style = "preserve"
indent-style = "space"

[tool.ty.environment]
python-version = "3.9"

[tool.ty.src]
exclude = [
    ".venv",
    "dist",
    "build",
    "tests/integration/configurator",
    "tests/integration/apps",
    "instrumentations/",
    "opamp/opamp_pb2.py"
]
