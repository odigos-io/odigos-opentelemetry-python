name: build

on:
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/0.11.2/install.sh | sh

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Validate pyproject.toml instrumentation lines
        run: |
          for d in instrumentations/opentelemetry-instrumentation-*; do
            inst=${d#*/opentelemetry-instrumentation-}
            grep -q "odigos-opentelemetry-instrumentation-$inst" pyproject.toml \
              || { echo "❌ pyproject.toml missing odigos-opentelemetry-instrumentation-$inst"; exit 1; }
          done

      - name: Build all instrumentations
        run: make build-instrumentations

      - name: Sync workspace
        run: uv sync --python ${{ matrix.python-version }}

      - name: Smoke check imports
        run: |
          uv run python -c "import initializer"
          uv run python -c "import opamp"

      # Scan what we release, not the development environment: assemble the agent exactly like
      # release.Dockerfile does (agent/ + the wheels built above) into a target directory.
      - name: Assemble the release artifact
        run: |
          set -euo pipefail
          # `make build-instrumentations` (above) and `uv build` place every workspace wheel in dist/.
          uv build
          # Stage agent/ outside the workspace, as the Dockerfile's COPY does; inside the checkout uv
          # would treat it as a workspace member and refuse to install it standalone.
          stage="$(mktemp -d)"
          cp -r agent "$stage/agent" && cp dist/*.whl "$stage/agent/"
          sed -i '/\[tool\.uv\.sources\]/,/^$/d' "$stage/agent/pyproject.toml"
          (cd "$stage" && uv pip install ./agent/ --find-links ./agent/ --prerelease=allow \
            --target "$GITHUB_WORKSPACE/release-workspace" --python ${{ matrix.python-version }})

      - name: Scan the release artifact (fail on CRITICAL)
        uses: odigos-io/ci-core/vulnerabilities-scanner@main
        with:
          path: release-workspace
          severity-cutoff: "CRITICAL"
